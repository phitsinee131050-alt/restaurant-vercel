{% extends "customer/base.html" %}{% block color %}#e67e22{% endblock %}
{% block nav %}<b>จองโต๊ะล่วงหน้า</b> <a href="/t/queue">รับคิวหน้าร้าน</a> <a href="/me">สมาชิก</a>{% endblock %}
{% block content %}{% for e in errs or [] %}<div class="card" style="color:#c0392b">• {{ e }}</div>{% endfor %}
<form class="card" method="post">ชื่อ <input name="name" value="{{ session.name if session.role == 'customer' else '' }}" required><br>เบอร์โทร <input name="phone" value="{{ session.username if session.role == 'customer' else '' }}" required><br>
วันที่ <input name="date" type="date" required> เวลา <input name="time" type="time" required><br>
จำนวนที่นั่ง <input name="seats" type="number" min="1" value="2" style="width:60px"><br><br><button class="green">ยืนยันการจอง</button></form>{% endblock %}
