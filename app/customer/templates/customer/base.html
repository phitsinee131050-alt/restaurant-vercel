<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สั่งอาหาร — ร้านอาหาร</title>
<style>*{box-sizing:border-box}body{font-family:sans-serif;margin:0;background:#fff7ee;color:#333}
header{background:linear-gradient(135deg,#ff9a3c,#e67e22);color:#fff;padding:18px 16px;text-align:center;border-radius:0 0 24px 24px;box-shadow:0 4px 12px #e67e2255}
header .brand{font-size:22px;font-weight:bold}header a{color:#fff;margin:6px 8px 0;display:inline-block;font-size:14px;text-decoration:underline}
main{max-width:520px;margin:auto;padding:14px 14px 90px}h3{color:#e67e22;border-left:5px solid #e67e22;padding-left:8px}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001}.off{opacity:.45}
img{width:64px;height:64px;object-fit:cover;border-radius:12px;vertical-align:middle}
input,select{padding:9px;margin:3px 0;border:1px solid #ddd;border-radius:10px;font-size:15px;max-width:100%}
button,.btn{padding:10px 18px;border:0;border-radius:24px;background:#e67e22;color:#fff;font-size:16px;text-decoration:none;display:inline-block}
.green{background:#27ae60}form>button.green:last-child{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(492px,92vw);padding:15px;font-size:18px;box-shadow:0 4px 14px #0003}</style></head>
<body><header><div class="brand">🍜 ร้านอาหาร</div><div style="font-size:14px"><a href="/t/reserve">📅 จองโต๊ะ</a><a href="/t/queue">🎫 รับคิว</a><a href="/me">👤 สมาชิก</a></div>{% block nav %}{% endblock %}</header><main>{% block content %}{% endblock %}</main>{% if live %}<script>let v=null;setInterval(async()=>{try{const j=await (await fetch("/live-version")).json();if(v&&j.v!==v)location.reload();v=j.v}catch(e){}},4000)</script>{% endif %}</body></html>
