<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDS — หน้าจอครัว</title>
<style>*{box-sizing:border-box}body{font-family:sans-serif;margin:0;background:#111;color:#eee}
header{background:#000;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #c0392b;font-size:26px;font-weight:bold}#clock{font-family:monospace;color:#f1c40f}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding:16px}
.card{background:#222;border-radius:10px;padding:14px;font-size:20px;border-top:8px solid #888}.card.pending{border-color:#e74c3c}.card.cooking{border-color:#f39c12}.card.ready{border-color:#2ecc71}
.card ul{padding-left:20px;margin:8px 0}.card b{color:#f1c40f}button{width:100%;padding:14px;border:0;border-radius:8px;font-size:20px;background:#444;color:#fff}.green{background:#27ae60}</style></head>
<body><header><span>👨‍🍳 หน้าจอครัว (KDS)</span><span id="clock"></span></header><main>{% block content %}{% endblock %}</main>
<script>setInterval(()=>clock.textContent=new Date().toLocaleTimeString("th-TH"),1000)</script>{% if live %}<script>let v=null;setInterval(async()=>{try{const j=await (await fetch("/live-version")).json();if(v&&j.v!==v)location.reload();v=j.v}catch(e){}},4000)</script>{% endif %}</body></html>
